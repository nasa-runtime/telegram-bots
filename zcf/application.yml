application:
  name: telegram-bots
  mode: service
  startup_timeout_ms: 30000
  shutdown_timeout_ms: 60000

log:
  level: ${TELEGRAM_LOG_LEVEL:info}
  # 日志目录需可写；显式将 TELEGRAM_LOG_PATH 设为空可只输出控制台。
  path: ${TELEGRAM_LOG_PATH:/usr/local/logs/telegram-bots}
  max_file_size: 100MB
  total_size_cap: 1GB
  max_history_days: 7
  clean_history_on_start: true
  split_error_file: true
  color: false

server:
  host: 0.0.0.0
  port: 2060
  health: true
  request_body_limit_bytes: 65536
  max_inflight_requests: 256
  graceful_shutdown_timeout_ms: 3000

rest_discovery:
  enabled: false

yml:
  imports:
    - file: ${TELEGRAM_YML:/etc/conf/telegram-bots.yml}
      optional: false

config_watch:
  enabled: true

catalog_watch:
  poll_interval_ms: 1000
  load_timeout_ms: 3000
