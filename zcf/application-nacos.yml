rest_discovery:
  enabled: true
  provider: nacos
  nacos:
    server_addr: ${NACOS_SERVER_ADDR}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    app_name: telegram-bots
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
  registration:
    enabled: true
    service_name: telegram-bots
    ip: ${TELEGRAM_REGISTER_IP}
    port: 0
    ephemeral: true
  rest:
    heuristic_http: false
